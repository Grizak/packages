name: ingest
on:
  repository_dispatch:
    types: [publish]

concurrency:
  group: ingest # serialise publishes so index updates don't race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg

      - name: Install go
        uses: actions/setup-go@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Import signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Fetch staged packages
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming

      - name: Update indexes
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: tools/scripts/ingest.sh

      - name: Check for changes
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against, building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- website/site/; then
            echo "No changes to website/site/, skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd tools/website/site
          pnpm build
          rsync -av --exclude=index.json dist/ ../../../site/

      - name: Generate site
        run: |
          go run tools/website/generate.go -site-dir site/ -meta-file package-meta.json

      - name: Publish
        working-directory: site
        run: |
          git config user.name  "package-bot"
          git config user.email "package-bot@users.noreply.github.com"
          git add -A
          git commit -m "publish $TAG"
          git push

      - name: Cleanup staging release
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
