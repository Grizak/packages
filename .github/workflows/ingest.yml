name: ingest
on:
  repository_dispatch:
    types: [publish]

concurrency:
  group: ingest # serialise publishes so index updates don't race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg

      - name: Import signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Fetch staged packages
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming

      - name: Update indexes
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: tools/scripts/ingest.sh

      - name: Publish
        working-directory: site
        run: |
          git config user.name  "package-bot"
          git config user.email "package-bot@users.noreply.github.com"
          git add -A
          git commit -m "publish $TAG"
          git push

      - name: Cleanup staging release
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
