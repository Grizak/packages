name: ingest
on:
  repository_dispatch:
    types: [publish]

concurrency:
  group: ingest # serialize publishes so index updates don't race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { path: tools, fetch-depth: 0 }

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg rpm zstd

      - name: Install go
        uses: actions/setup-go@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Prepare workspace
        run: mkdir -p site incoming

      - name: Fetch packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pool --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create pool --repo "$GITHUB_REPOSITORY" \
                 --title "Package pool" --notes "Archive of all published packages" --latest=false
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming
          gh release upload pool incoming/* --repo "$GITHUB_REPOSITORY" --clobber
          rm -rf incoming/*
          gh release download pool --repo "$GITHUB_REPOSITORY" --dir incoming --clobber

      - name: Update indexes
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: tools/scripts/ingest.sh

      - name: Build
        run: |
          cd tools/website/site
          pnpm install
          pnpm build
          rsync -av --exclude=index.json dist/ ../../../site/

      - name: Generate site
        run: |
          go run tools/website/generate.go -site-dir site/ -meta-file package-meta.json

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Verify staged site is complete
        run: |
          for f in index.html key.asc \
                   apt/dists/stable/Release apt/dists/stable/InRelease \
                   rpm/repodata/repomd.xml \
                   arch/x86_64/grizak.db arch/aarch64/grizak.db; do
            [ -s "site/$f" ] || { echo "Missing site/$f, refusing to sync" >&2; exit 1; }
          done

      - name: Sync to R2
        env:
          RCLONE_CONFIG_CDN_TYPE: s3
          RCLONE_CONFIG_CDN_PROVIDER: Cloudflare
          RCLONE_CONFIG_CDN_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_CDN_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          RCLONE_CONFIG_CDN_NO_CHECK_BUCKET: "true"
        run: rclone sync site cdn:repo --checksum

      - name: Cleanup staging release
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
