name: Publish to package repo
description: Build packages and publish them to the central repo
inputs:
  build-command: { default: make package }
  build-dir: { default: build }
  repo: { default: Grizak/packages }
  token: { required: true }
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: ${{ inputs.build-command }}

    - name: Stage and dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BUILD_DIR: ${{ inputs.build-dir }}
        REPO: ${{ inputs.repo }}
      run: |
        shopt -s nullglob
        files=("$BUILD_DIR"/*.deb "$BUILD_DIR"/*.rpm "$BUILD_DIR"/*.pkg.tar.zst)
        [ ${#files[@]} -gt 0 ] || { echo "No packages found in $BUILD_DIR"; exit 1; }

        tag="incoming-${GITHUB_REPOSITORY//\//-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        gh release create "$tag" --repo "$REPO" --prerelease \
          --title "$tag" --notes "From $GITHUB_REPOSITORY@$GITHUB_SHA" "${files[@]}"
        gh api "repos/$REPO/dispatches" -f event_type=publish -f "client_payload[tag]=$tag"
